services:
  pydeep:
    image: codebasic/pydeep
    container_name: pydeep
    gpus: all
    shm_size: 4g
    ports:
      - "8888:8888"  # JupyterLab
      - "6006:6006"  # Map host port 6006 to container port 6006 (TensorBoard)
    volumes:
      - type: bind
        source: .
        target: /workspace
