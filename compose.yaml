services:
  pydeep:
    image: codebasic/pydeep:26.10
    container_name: pydeep
    gpus: all
    shm_size: 4g
    ports:
      - "127.0.0.1:8888:8888"  # JupyterLab
      - "127.0.0.1:6006:6006"  # Map host port 6006 to container port 6006 (TensorBoard)
    volumes:
      - type: bind
        source: .
        target: /workspace
